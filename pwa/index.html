<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081b2b">
  <meta name="description" content="Pronostici, risultati e statistiche degli engine GioOver 2.5.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/gioover-ov25-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/gioover-ov25-apple-180.png">
  <link rel="stylesheet" href="styles.css?v=11">
  <title>GioOver 2.5</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icons/gioover-ov25-192.png" alt="">
      <div><strong>GioOver 2.5</strong><span>Centro pronostici</span></div>
    </div>
    <div class="app-actions">
      <button id="updateButton" class="update" hidden>Aggiorna app</button>
      <button id="installButton" class="install" hidden>Installa app</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">PANORAMICA GIORNALIERA</p>
        <h1 id="pageTitle">Partite di oggi</h1>
        <p id="lastUpdate" class="muted">Caricamento dati…</p>
      </div>
      <button id="refreshButton" class="refresh" aria-label="Aggiorna dati">Aggiorna</button>
    </section>

    <section id="kpiSection" class="kpis" aria-label="Riepilogo">
      <article><span>Partite</span><strong id="matchesKpi">—</strong></article>
      <article><span>Selezioni ALTA</span><strong id="highKpi">—</strong></article>
      <article><span>OK</span><strong id="okKpi" class="ok">—</strong></article>
      <article><span>KO</span><strong id="koKpi" class="ko">—</strong></article>
    </section>

    <section id="filterSection" class="panel filters" aria-label="Filtri">
      <label>Giornata<select id="dateFilter"></select></label>
      <label>Engine<select id="engineFilter"><option value="">Tutti</option></select></label>
      <label>Fascia<select id="bandFilter"><option value="">Tutte</option><option>ALTA</option><option>MEDIA</option><option>BASSA</option></select></label>
    </section>

    <nav class="tabs" aria-label="Sezioni">
      <button class="active" data-view="predictions">Pronostici</button>
      <button data-view="results">Risultati</button>
      <button data-view="engines">Engine</button>
      <button data-view="live">Monitor LIVE</button>
    </nav>

    <section id="statusMessage" class="notice" hidden></section>
    <section id="liveSummary" class="live-summary" hidden>
      <article><span>FASCIA ALTA</span><strong id="liveHigh">—</strong></article>
      <article><span>TOTALE ENGINE</span><strong id="liveTotal">—</strong></article>
    </section>
    <section id="content" class="cards" aria-live="polite"></section>
  </main>

  <footer>GioOver 2.5 · dati aggiornati automaticamente</footer>
  <script src="app.js?v=11" defer></script>
</body>
</html>
