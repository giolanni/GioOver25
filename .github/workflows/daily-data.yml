name: Aggiorna dati GioOver

on:
  push:
    branches: [v2-dev]
    paths: ['.github/workflows/daily-data.yml']
  schedule:
    # GitHub usa UTC: 05:17 UTC corrisponde alle 06:17 in Italia d'inverno
    # e alle 07:17 d'estate. Il minuto 17 evita il picco di carico di inizio ora.
    - cron: '17 5 * * *'
    # Secondo tentativo: non fa nulla se i dati del giorno sono gia presenti.
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione da eseguire
        required: true
        default: smoke
        type: choice
        options: [smoke, morning, morning_recovery, results]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: gioover-daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      operation: ${{ steps.operation.outputs.operation }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2-dev
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Determina operazione pianificata
        id: operation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            operation="smoke"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            operation="${{ inputs.operation }}"
          elif [[ "${{ github.event.schedule }}" == "17 5 * * *" ]]; then
            operation="morning"
          elif [[ "${{ github.event.schedule }}" == "47 5 * * *" ]]; then
            operation="morning_recovery"
          else
            echo "Pianificazione non riconosciuta: ${{ github.event.schedule }}" >&2
            exit 1
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "Operazione: $operation"
      - name: Esegue pipeline
        run: python tools/run_scheduled_pipeline.py "${{ steps.operation.outputs.operation }}"
      - name: Registra aggiornamenti su v2-dev
        if: steps.operation.outputs.operation != 'smoke'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            data/input_partite
            data/output_ranking
            data/output_gs1_over
            data/output_report
            data/storico/gs1_over
            data/storico/report_selections
            data/storico/ranking
            data/storico/risultati
            data/operational/kickoff_times.csv
            data/classifiche
          )
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && git add -- "$path"
          done
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Dati automatici: ${{ steps.operation.outputs.operation }} $(date -u +%F)"
          git status --short
          git push origin HEAD:v2-dev

  build-site:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2-dev
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Genera dati PWA aggiornati
        run: python tools/build_pwa_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pwa

  deploy-site:
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
