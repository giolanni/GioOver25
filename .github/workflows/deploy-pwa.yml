name: Pubblica GioOver PWA

on:
  push:
    branches: [v2-dev]
    paths:
      - 'pwa/**'
      - 'tools/build_pwa_data.py'
      - 'data/output_ranking/**'
      - 'data/output_gs1_over/**'
      - 'data/storico/ranking/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Genera dati PWA dagli output reali
        run: python tools/build_pwa_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pwa

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
